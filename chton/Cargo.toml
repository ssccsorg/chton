[package]
name = "chton"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chton: IO materialization fabric — matrix router and transformation implementations for coordinate spaces over physical origins"

[dependencies]
tagma-core.workspace = true
tagma-geo.workspace = true
tagma-map.workspace = true
async-trait = "0.1"
futures-executor = "0.3"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
serde_json = "1"
ureq = "3"
